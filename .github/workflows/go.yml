name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.21

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  # Once the tests pass on master, tag and release the next patch version
  # (buildpipeline's go-library-release.yml), so services require real
  # versions and Renovate offers version bumps instead of commit-hash updates.
  release:
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: Preciselyco/buildpipeline/.github/workflows/go-library-release.yml@main
